name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:../db/ci.db
      SESSION_SECRET: ci-only-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (domain seam, coverage-gated)
        run: bun run test:coverage

      - name: Push CI database schema
        run: bun run db:push

      - name: Seed CI database
        run: bun run scripts/seed.ts

      - name: Production build
        run: bun run build
